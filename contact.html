<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <title>Contact</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <!--header section-->
    <header class="header-section">
        <div class="left-header">
            <div class="logo">
                <a href=""><img id="logo" src="image/gold logo.png" alt="logo"> </a>
            </div>
            <div class="cart-opt">
                <ul>
                    <li><a href=""><i class="fa-solid fa-shopping-cart" id="cart"></i></a></li>
                    <div class="part"></div>
                    <li><a href=""><i class="fa-solid fa-bars" id="opt"></i></a></li>
                </ul>
            </div>
        </div>
        <div class="right-header">
            <!--navigation bar-->
            <nav class="navbar">
              <ul>
                <li class="nav-links"><a href="index.html">Home</a></li>
                <li class="nav-links"><a href="index.html#about">About us</a></li>
                <li class="nav-links"><a href="index.html#menu">Menu</a></li>
                <li class="nav-links"><a href="location.html">Location</a></li>
                <li class="nav-links"><a href="contact.html">Contact</a></li>
              </ul>
            </nav>
            <a href="index.html#book-now" class="btn ss-btn">Book Seat</a>
        </div>
    </header>

    <!--main section-->
    <main>
        <section class="contact-us">
           <div class="c-head"> <h1>Contact Us</h1>
            <span>Home > Contact us</span></div>
        </section>
        <div class="map-section">
            <div class="contact-form-container">
        <!-- Section Title Header -->
        <div class="form-heading">
            <h2>Get In Touch With Us</h2>
        </div>

        <!-- The Content Form Element -->
        <form class="contact-form" action="#" method="POST">
            
            <!-- Left Side Data Inputs Column -->
            <div class="input-group-left">
                <input type="text" class="form-control" placeholder="Your Name" required>
                <input type="email" class="form-control" placeholder="Your Email" required>
                <input type="tel" class="form-control" placeholder="Your Phone">
                <input type="text" class="form-control" placeholder="Subject">
            </div>

            <!-- Right Side Message Box Column -->
            <div class="input-group-right">
                <textarea class="form-control" placeholder="Write Your Message..." required></textarea>
            </div>

            <!-- Full Width Bottom Button Container -->
            <div class="form-submit-container">
                <button type="submit" class="btn ss-btn" style="padding: 2% 35% 6% 10%;">Send Message</button>
            </div>

        </form>
          
    </main>
</body>
</html>
